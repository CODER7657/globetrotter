<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlobeTrotter</title>
    <meta name="description" content="Plan multi-city trips end to end." />
    <script>
      // Applied before first paint so the correct theme is painted immediately —
      // no flash of the wrong background on load.
      ;(function () {
        try {
          var stored = localStorage.getItem('gt-theme')
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || ((stored === null || stored === 'system') && system)
          document.documentElement.classList.toggle('dark', dark)
        } catch (_) {}
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
